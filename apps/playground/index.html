<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="{{csp}}">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Playground · Tape</title>
<meta name="description" content="Write a Tape program and run it in your browser: the compiler, the programs and SQLite all run in this page.">
<link rel="icon" href="{{icon}}" type="image/svg+xml">
<script src="{{site}}"></script>
<link rel="stylesheet" href="{{css}}">
<link rel="stylesheet" href="{{pgcss}}">
<link rel="stylesheet" href="{{tracecss}}">
{{preload}}
<script type="application/json" id="config">{{config}}</script>
<script type="module" src="{{main}}"></script>
</head>
<body class="pg">
<a class="skip" href="#editor">Skip to the editor</a>
<header class="top">
  <a class="brand" href="../" aria-label="Tape, home"><img src="{{icon}}" alt="" width="24" height="24"><span>Tape</span><span class="sub">Playground</span></a>
  <span class="divider" aria-hidden="true"></span>
  <label class="pick"><span class="sr">Example</span><select id="example" class="field"></select></label>
  <div class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span class="text" id="status-text">Loading the compiler…</span></div>
  <div class="actions">
    <button type="button" id="format" class="btn ghost sm" title="tape fmt: the one layout" aria-label="Format"><svg class="ico" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2.5 4h11M5.5 8h8M5.5 12h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg><span class="lbl">Format</span></button>
    <button type="button" id="simulate" class="btn sm" aria-label="Simulate" title="tape sim: random requests, lost and cut calls, timers, against the invariants"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg><span class="lbl">Simulate</span></button>
    <a class="btn ghost icon sm hide-sm" href="{{github}}" aria-label="Tape on GitHub" title="GitHub"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
    <button type="button" id="theme" class="btn ghost icon sm" aria-label="Switch between light and dark" title="Light or dark"><svg class="moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><svg class="sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </div>
</header>
<noscript><p class="noscript">The playground compiles and runs programs in this page, which needs JavaScript. The <a href="../">homepage</a> shows a program, its runs and its trace without it.</p></noscript>

<div class="views tabs" role="tablist" aria-label="Show" id="views">
  <button type="button" role="tab" aria-selected="true" data-view="code" aria-controls="pane-code">Code</button>
  <button type="button" role="tab" aria-selected="false" data-view="run" aria-controls="pane-run" tabindex="-1">Run</button>
  <button type="button" role="tab" aria-selected="false" data-view="trace" aria-controls="pane-run" tabindex="-1">Trace</button>
</div>

<main class="layout" id="layout" data-view="code">
  <section class="pane code" id="pane-code" aria-label="Program">
    <div class="pane-head">
      <div class="tabs ftabs" id="tabs" role="tablist" aria-label="Programs"></div>
      <div class="status status-2" id="status-2"><span class="dot"></span><span class="text" id="status-2-text"></span></div>
      <span class="meta" id="code-meta"></span>
    </div>
    <p class="blurb" id="blurb"></p>
    <div id="editor"></div>
    <div class="problems" id="problems" hidden></div>
  </section>
  <div class="split" id="split" role="separator" aria-orientation="vertical" aria-label="Resize the program and the run" aria-controls="pane-code" tabindex="0" aria-valuemin="30" aria-valuemax="75" aria-valuenow="56"></div>
  <section class="pane run" id="pane-run" aria-label="Requests">
    <div class="card sim" id="sim" hidden></div>

    <div class="card request">
      <div class="presets" id="presets" aria-label="Requests to send"></div>
      <form id="form" class="reqline" autocomplete="off">
        <select id="to" class="field" aria-label="Program" hidden></select>
        <div class="url-field">
          <select id="method" aria-label="Method"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select>
          <input id="path" aria-label="Path" spellcheck="false" value="/" autocapitalize="off">
        </div>
        <button type="submit" class="btn primary" id="send" aria-keyshortcuts="Control+Enter Meta+Enter">Send <kbd aria-hidden="true">⌘↵</kbd></button>
      </form>
      <textarea id="body" class="body field" aria-label="Body" placeholder="Body (JSON)" spellcheck="false" rows="2"></textarea>
      <div class="knobs" id="knobs"></div>
    </div>

    <div class="card result" id="result">
      <div class="result-head" id="result-head"><span class="muted">Send a request: it runs here, against SQLite in this page.</span></div>
      <div class="tabs rtabs" role="tablist" aria-label="What the request did">
        <button type="button" role="tab" data-tab="response" aria-selected="true" aria-controls="rbody">Response</button>
        <button type="button" role="tab" data-tab="spans" aria-selected="false" aria-controls="rbody" tabindex="-1">Spans</button>
        <button type="button" role="tab" data-tab="trace" aria-selected="false" aria-controls="rbody" tabindex="-1">Trace</button>
        <button type="button" role="tab" data-tab="log" aria-selected="false" aria-controls="rbody" tabindex="-1">Effect log</button>
        <button type="button" role="tab" data-tab="data" aria-selected="false" aria-controls="rbody" tabindex="-1">Data</button>
        <button type="button" role="tab" data-tab="otlp" aria-selected="false" aria-controls="rbody" tabindex="-1">OTLP</button>
      </div>
      <div class="rbody on" id="rbody" role="tabpanel" tabindex="0"></div>
    </div>

    <div class="card timers" id="timers" hidden></div>
    <div class="card history" id="history" hidden></div>
    <p class="foot">The compiler, your programs and SQLite run in this page. Nothing you type is sent anywhere.</p>
  </section>
</main>
</body>
</html>
