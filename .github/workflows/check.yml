# Every check in the repository (proof/all.ts), each night and on demand. Not on every push: a full run takes
# several minutes; `npm test` (proof/all.ts --quick) is the check to run before a commit.
name: check
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
concurrency:
  group: check
  cancel-in-progress: true
jobs:
  all:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - name: formatter and type checker
        run: npm ci
      - name: service dependencies
        run: npm ci
        working-directory: service
      - name: tape-mcp dependencies
        run: npm ci
        working-directory: mcp
      - name: every check
        run: node proof/all.ts
